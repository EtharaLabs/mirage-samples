files = ["/app/answer.md"]
annotations = { obligation = "DEL-2", dimension = "outcome" }

[[criterion]]
id = "R16"
name = "R16"
description = "The response explains the `TypeError` from `df &= other_df`: the union-aligned `&` puts a missing value into the integer column `a`, making it `float64`, and `float & int` raises inside the operation, before `reindex_like` is reached."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-2", dimension = "outcome" }

[[criterion]]
id = "R17"
name = "R17"
description = "The response explains why the variants behave: identical labels add nothing, `Int64` holds the missing value in its mask, boolean operators fill the aligned missing values with `False` (`fill_bool`), plain `x + partner` is supposed to return the union, and labels of `x` that the partner lacks are missing in the operation itself."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-2", dimension = "outcome" }

[[criterion]]
id = "R18"
