[judge]
judge = "anthropic/claude-fable-5-1"
mode = "individual"
samples = 1
timeout = 900
guard = "flag"
files = ["/app/answer.md", "/app/process.md"]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "R1"
name = "R1"
description = "The response states that there are four distinct root causes, one behind each of the four steps, rather than one shared cause."
type = "binary"
weight = 5
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-5", dimension = "outcome" }

[[criterion]]
id = "R2"
name = "R2"
description = "The response states that the four faults are independent, so that fixing any one of them leaves the other steps wrong."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-5", dimension = "outcome" }

[[criterion]]
id = "R3"
name = "R3"
description = "The response identifies `tuples_to_object_array` in `pandas/_libs/lib.pyx` as sizing every row by the first tuple's length and copying only that many elements, so a longer key is cut to its prefix and a shorter one raises `IndexError`."
type = "binary"
weight = 5
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R4"
name = "R4"
description = "The response identifies `Index._maybe_downcast_for_indexing` in `pandas/core/indexes/base.py` as converting the flat keys with `MultiIndex.from_tuples` and keeping the result without checking that its number of levels equals the index's."
type = "binary"
weight = 5
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R5"
name = "R5"
description = "The response explains that `MultiIndex.from_tuples` uses `tuples_to_object_array` (its only caller) for ndarray or `Index` input, while a plain list is turned into a three-level index padded with a missing value by the `Index` constructor."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R6"
name = "R6"
description = "The response explains the comparison downstream: `Index._get_indexer` calls the codes engine's `_extract_level_codes`, which recodes the target with `_recode_for_new_levels(self.levels)` for only as many levels as the index has, so a longer target matches on its prefix, and a target with fewer levels raises the `AssertionError`."
type = "binary"
weight = 5
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R7"
name = "R7"
description = "The response traces `reindex`, `.loc[[...]]` and `DataFrame.reindex` to `Index.get_indexer`, which calls `_maybe_downcast_for_indexing`, and lists that helper's callers: `get_indexer`, `get_indexer_non_unique` and `join`."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R8"
name = "R8"
description = "The response explains that `MultiIndex._wrap_reindex_result` builds the result's index from `self.take(indexer)`, so the three-part label disappears from it, and that `Index.map` cuts tuples because it passes an ndarray to `MultiIndex.from_tuples`."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R9"
name = "R9"
description = "The response explains why the variants behave: keys of the right length convert exactly, a single tuple in `.loc` is rejected with `Too many indexers`, and `MultiIndex.isin` checks every value's length before converting."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R10"
name = "R10"
description = "The response proposes, for step A, a length check in `tuples_to_object_array` and a level-count check in `_maybe_downcast_for_indexing` that falls back to a flat comparison."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-1", dimension = "outcome" }

[[criterion]]
id = "R11"
