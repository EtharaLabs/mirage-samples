reward_type = "bounded_continuous"

artifacts = [
    "/workspace/answer.md",
    "/logs/agent/trajectory.json",
    "/logs/agent/answer.md",
    { source = "/logs/agent/sessions", destination = "agent-sessions" },
    { source = "/logs/agent/completions", destination = "agent-completions" },
