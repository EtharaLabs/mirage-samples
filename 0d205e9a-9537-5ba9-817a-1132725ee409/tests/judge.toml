[judge]
judge = "anthropic/claude-fable-5-1"
mode = "individual"
samples = 1
timeout = 900
guard = "flag"
files = ["/app/answer.md", "/app/process.md"]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "R1"
name = "R1"
description = "The response states that there are five distinct root causes, one behind each of the five pipelines, rather than a single shared cause."
type = "binary"
weight = 5
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-5", dimension = "outcome" }

[[criterion]]
id = "R2"
name = "R2"
description = "The response states that in pipelines A to D the values and their validity are correct and only the sorted marker the result carries is wrong."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-5", dimension = "outcome" }

[[criterion]]
id = "R3"
name = "R3"
description = "The response explains that `max` and `min` on a column marked sorted read the element at `last_non_null` / `first_non_null`, and that those `ChunkedArray` methods in `crates/polars-core/src/chunked_array/mod.rs` infer where all missing entries are from element 0 alone, so a marked column whose missing entries are not all at one end yields a missing maximum or minimum."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-5", dimension = "outcome" }

[[criterion]]
id = "R4"
