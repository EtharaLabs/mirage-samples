description = "The response explains that `n_unique` and `unique` in `crates/polars-core/src/chunked_array/ops/unique/mod.rs`, on a column marked sorted, count or keep runs of consecutive equal values (treating missing as a value), which is why each reported distinct count is too high."
type = "binary"
weight = 3
negate = false
files = ["/app/answer.md"]
annotations = { obligation = "DEL-5", dimension = "outcome" }

[[criterion]]
id = "R5"
