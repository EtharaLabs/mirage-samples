description = "The response identifies `BlockManager.iset` in `pandas/core/internals/managers.py`: for an extension value `value_getitem` returns the value itself and a new block is created per position with `new_block_2d(values=value, ...)`, so all matched columns hold the same array object."
type = "binary"
