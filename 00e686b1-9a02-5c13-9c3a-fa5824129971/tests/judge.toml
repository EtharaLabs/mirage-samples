[[criterion]]
id = "R33"
name = "R33"
description = "The response identifies `DataFrame._set_item` in `pandas/core/frame.py` as skipping the broadcast across the matched columns for a one-dimensional-only extension array (the `not is_1d_only_ea_dtype(value.dtype)` condition), so one array is passed on for every matched position."
type = "binary"
