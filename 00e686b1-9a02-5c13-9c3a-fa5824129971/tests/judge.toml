description = "The response explains why Copy-on-Write does not catch the sharing: `_sanitize_column` returns a fresh copy with no references (`refs=None`), so each new block gets its own reference tracker (`BlockValuesRefs`), `_has_no_reference` is true, and `column_setitem` writes in place into the shared array."
type = "binary"
